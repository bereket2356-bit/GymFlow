function saveAttendance(){
  const session = currentSession();
  if (!session || session.status !== "Planned") return;
  const sid = session.id;
  const marks = state.marks[sid] || (state.marks[sid] = {});
  const saved = state.savedMarks[sid] || {};
  const bucket = state.deductions[sid] || (state.deductions[sid] = {});
  let deducted = 0, restored = 0;
  (ROSTERS[sid] || []).forEach(function(cid){
    const c = customerById(cid);
    if (!c) return;
    const m = currentMembership(c);
    const now = marks[cid] === "P" || marks[cid] === "L";
    const was = saved[cid] === "P" || saved[cid] === "L";
    if (now && !was){
      const log = state.attendanceLog[cid] || (state.attendanceLog[cid] = []);
      if (log.indexOf(TODAY) === -1) log.push(TODAY);
    }
    if (!m || memType(m) !== "session") return;
    if (now && !was && (m.sessionsLeft || 0) > 0){
      m.sessionsLeft -= 1;
      deducted++;
      bucket[cid] = true;
    } else if (!now && was && bucket[cid]){
      if ((m.sessionsLeft || 0) < (m.sessionsTotal || 0)) m.sessionsLeft += 1;
      delete bucket[cid];
      restored++;
    }
  });
  state.savedMarks[sid] = Object.assign({}, marks);
  session.booked = (ROSTERS[sid] || []).filter(function(cid){ return marks[cid] === "P" || marks[cid] === "L"; }).length;
  closeModal();
  paint();
  const bits = [];
  if (deducted) bits.push(deducted + " " + plural(deducted, "session") + " deducted");
  if (restored) bits.push(restored + " " + plural(restored, "session") + " restored");
  toast("Attendance saved for " + session.title + ". " + (bits.length ? bits.join(", ") : "No session changes") + ".");
}

  return out;
}

function heatLevel(n){ if (n <= 0) return 0; if (n <= 3) return 1; if (n <= 6) return 2; if (n <= 9) return 3; return 4; }
function heatData(){
  const dow = (parseISO(TODAY).getDay() + 6) % 7;
  const monday = shiftISO(-dow);
  const start = addDaysISO(monday, -21);
  const cells = [];
  for (let i = 0; i < 28; i++){
    const date = addDaysISO(start, i);
    const dd = parseISO(date);
    let count = 2 + ((dd.getDate() * 7 + (dd.getMonth() + 1) * 3 + dd.getDay()) % 9);
    if (dd.getDay() === 0 || dd.getDay() === 6) count += 2;
    if (date === TODAY) count = Math.max(count, 7);
    cells.push({ date: date, count: count, level: heatLevel(count) });
  }
  return cells;
}
function heatmapHTML(){

  const body = cells.map(function(c){
    return '<span class="heat-cell" data-level="' + c.level + '" title="' + esc(fmtDate(c.date) + " · " + c.count + " visits") + '">' + c.count + '</span>';
  }).join("");

    '<div class="heat-legend" aria-hidden="true"><span>Fewer</span><span class="sw" style="background:var(--surface-2)"></span><span class="sw" style="background:color-mix(in srgb,var(--success) 14%,transparent);border-color:color-mix(in srgb,var(--success) 24%,var(--border))"></span><span class="sw" style="background:color-mix(in srgb,var(--success) 30%,transparent)"></span><span class="sw" style="background:color-mix(in srgb,var(--success) 65%,transparent)"></span><span class="sw" style="background:var(--success)"></span><span>More · 0, 1–3, 4–6, 7–9, 10+ visits</span></div>';

function downloadFile(name, content, type){

  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
}

function submitSettings(){

function pkgDraftFrom(p){

  return {
    id: p.id, name: p.name, description: p.description || "", type: p.type,

    sessions: p.sessions, price: Number(p.price).toFixed(2), active: !!p.active
  };
}
function pkgComparable(d){
  return {
    name: String(d.name || "").trim(), description: String(d.description || "").trim(), type: d.type,
    validity: d.type === "time" || d.type === "both" ? { n: String(d.validity && d.validity.n), unit: d.validity && d.validity.unit } : null,
    sessions: d.type === "session" || d.type === "both" ? String(d.sessions == null ? "" : d.sessions) : null,

  };
}
function pkgDirty(){

}
function pkgHasTime(d){ return d.type === "time" || d.type === "both"; }
function pkgHasSessions(d){ return d.type === "session" || d.type === "both"; }

function pkgFormErrors(d){
  const e = {};
  const name = String(d.name || "").trim();
  if (name.length < 2) e.name = "Enter a package name of 2 to 60 characters.";
  else if (name.length > 60) e.name = "Use 60 characters or fewer.";
  else if (state.packages.some(function(p){ return p.id !== d.id && p.name.trim().toLowerCase() === name.toLowerCase(); })) e.name = "A package with this name already exists.";
  if (String(d.description || "").length > 240) e.description = "Shorten the description to 240 characters or fewer.";
  if (["time", "session", "both"].indexOf(d.type) < 0) e.type = "Choose a package type.";
  if (pkgHasTime(d)){
    const n = Number(d.validity && d.validity.n);
    if (!isFinite(n) || Math.floor(n) !== n || n < 1 || n > 365) e.validity = "Use a whole number from 1 to 365.";
    if (!d.validity || ["days", "weeks", "months", "years"].indexOf(d.validity.unit) < 0) e.validity = "Choose a validity unit.";
  }
  if (pkgHasSessions(d)){
    const n = Number(d.sessions);
    if (String(d.sessions == null ? "" : d.sessions).trim() === "" || !isFinite(n) || Math.floor(n) !== n || n < 1 || n > 500) e.sessions = "Use a whole number from 1 to 500.";
  }
  const price = Number(d.price);
  if (String(d.price == null ? "" : d.price).trim() === "" || !isFinite(price) || price < 0) e.price = "Enter a price of 0 or more.";
  return e;
}

      for (let i = 0; i < shown; i++) blocks += '<span class="pkg-session" aria-hidden="true"></span>';
      if (n > shown) blocks += '<span class="pkg-session-more">+' + (n - shown) + ' more</span>';
      parts.push('<div class="pkg-sessions" aria-hidden="true">' + blocks + '</div><p class="pkg-preview-note">' + n + ' session' + (n === 1 ? "" : "s") + ' included. Each attendance deducts one.</p>');
    }
  }
  return parts.join("");
}

function setPkgError(key, msg){
  const map = { name: "pkg-name", description: "pkg-desc", type: "pkg-type", validity: "pkg-validity", sessions: "pkg-sessions", price: "pkg-price" };
  const err = document.getElementById("pkg-" + key + "-err");
  if (!err) return;
  if (msg){ err.textContent = msg; err.hidden = false; }
  else { err.textContent = ""; err.hidden = true; }
  const input = document.getElementById(map[key] || "");
  if (input){
    input.classList.toggle("has-error", !!msg);
    if (msg) input.setAttribute("aria-invalid", "true"); else input.removeAttribute("aria-invalid");
  }
  if (key === "validity") ["pkg-validity-n", "pkg-validity-unit"].forEach(function(id){
    const el = document.getElementById(id);
    if (el) el.classList.toggle("has-error", !!msg);
  });
}
function refreshPackageForm(){
  const ed = state.pkgEditor;
  if (!ed) return;
  const d = ed.draft;
  const errors = pkgFormErrors(d);
  document.querySelectorAll("[data-pkg-type]").forEach(function(input){
    input.checked = input.value === d.type;
    const card = input.closest(".pkg-type");
    if (card) card.classList.toggle("is-checked", input.value === d.type);
  });
  const timeWrap = document.getElementById("pkg-validity-wrap");
  const sessWrap = document.getElementById("pkg-sessions-wrap");
  if (timeWrap) timeWrap.classList.toggle("is-hidden", !pkgHasTime(d));
  if (sessWrap) sessWrap.classList.toggle("is-hidden", !pkgHasSessions(d));
  const preview = document.getElementById("pkg-preview");
  if (preview) preview.innerHTML = pkgPreviewHTML(d);
  const count = document.getElementById("pkg-desc-count");
  if (count){
    const len = String(d.description || "").length;
    count.textContent = len + " / 240";
    count.classList.toggle("is-over", len > 240);
  }
  const copy = document.getElementById("pkg-validity-copy");
  if (copy && pkgHasTime(d)){
    const n = Number(d.validity && d.validity.n);
    const unit = d.validity && d.validity.unit;
    copy.textContent = (isFinite(n) && n >= 1 && n <= 365) ? "Valid for " + validityLabel(n, unit) + ". Expiry is calculated from the start date using the gym’s counting rule." : "Enter a validity period to see the expiry rule.";
  }
  const save = document.getElementById("pkg-save");
  if (save) save.disabled = Object.keys(errors).length > 0;
  ["name", "description", "type", "validity", "sessions", "price"].forEach(function(key){
    const show = ed.showAll || ed.touched[key];
    setPkgError(key, show ? errors[key] || "" : "");
  });
  return errors;
}

function openPackageEditor(id){
  const src = id ? packageById(id) : null;
  if (id && !src) return;
  const draft = pkgDraftFrom(src);
  state.pkgTrigger = document.activeElement;
  state.pkgEditor = {
    mode: id ? "edit" : "new", id: id || null, draft: draft,
    initial: JSON.parse(JSON.stringify(draft)), savedType: draft.type, savedSessions: draft.sessions,
    termsApproved: null, touched: {}, showAll: false
  };
  renderPackagePanel();
}
function closePackagePanel(restoreFocus){
  const ed = state.pkgEditor;
  if (!ed) return;
  const trigger = state.pkgTrigger;
  state.pkgEditor = null;
  state.pkgTrigger = null;
  state.pkgPending = null;
  const root = document.getElementById("pkg-panel-root");
  if (root) root.innerHTML = "";
  document.body.style.overflow = document.getElementById("modal-root").children.length ? "hidden" : "";
  if (restoreFocus && trigger && document.contains(trigger)) { try { trigger.focus(); } catch (e) {} }
}
function openPackageConfirm(opts){
  state.pkgPending = { onConfirm: opts.onConfirm || null, onCancel: opts.onCancel || null };
  openModal(modalHead(opts.title, opts.sub || "") +
    '<div class="modal-body"><div class="confirm-block">' + opts.body + '</div></div>' +
    '<div class="modal-foot"><button class="btn" type="button" data-action="pkg-confirm-cancel">' + esc(opts.cancelLabel || "Cancel") + '</button><button class="btn ' + (opts.danger ? "btn-danger" : "btn-primary") + '" type="button" data-action="pkg-confirm">' + esc(opts.confirmLabel) + '</button></div>');
}
function requestClosePackage(){
  if (!state.pkgEditor) return;
  if (pkgDirty()){
    openPackageConfirm({
      title: "Discard unsaved changes?",
      body: '<p>Your edits to this package will be lost. The package catalogue stays unchanged.</p>',
      confirmLabel: "Discard changes",
      danger: true,
      onConfirm: function(){ closePackagePanel(true); }
    });
    return;
  }
  closePackagePanel(true);
}
function pkgSessionConfirmIfNeeded(){
  const ed = state.pkgEditor;
  if (!ed || ed.mode !== "edit" || packageMemberships(ed.id).length === 0 || !pkgHasSessions(ed.draft)) return;
  if (Number(ed.draft.sessions) === Number(ed.savedSessions) || ed.termsApproved === pkgTermsKey(ed.draft)) return;
  const key = pkgTermsKey(ed.draft);
  openPackageConfirm({
    title: "Change the session allowance?",
    body: '<p>Existing memberships keep their original terms. Only new memberships use the new allowance.</p>',
    confirmLabel: "Use new allowance",
    onConfirm: function(){ ed.termsApproved = key; refreshPackageForm(); },
    onCancel: function(){ ed.draft.sessions = ed.savedSessions; refreshPackageForm(); }
  });
}
function applyPackageType(value){
  const ed = state.pkgEditor;
  if (!ed || !value || value === ed.draft.type) return;
  if (ed.mode === "edit" && packageMemberships(ed.id).length > 0){
    openPackageConfirm({
      title: "Change the package type?",
      body: '<p>Existing memberships keep the type they were sold. The new type applies to new memberships only.</p>',
      confirmLabel: "Change type",
      onConfirm: function(){ ed.draft.type = value; ed.termsApproved = pkgTermsKey(ed.draft); refreshPackageForm(); },
      onCancel: function(){ refreshPackageForm(); }
    });
    return;
  }
  ed.draft.type = value;
  if (value === "time" && ed.draft.validity == null) ed.draft.validity = { n: 1, unit: "months" };
  if (value === "session" && ed.draft.sessions == null) ed.draft.sessions = 10;
  refreshPackageForm();
}
function savePackage(){
  const ed = state.pkgEditor;
  if (!ed) return;
  const errors = pkgFormErrors(ed.draft);
  if (Object.keys(errors).length){
    ed.showAll = true;
    refreshPackageForm();
    const first = ["name", "description", "type", "validity", "sessions", "price"].find(function(k){ return errors[k]; });
    const ids = { name: "pkg-name", description: "pkg-desc", type: "pkg-type", validity: "pkg-validity-n", sessions: "pkg-sessions", price: "pkg-price" };
    const target = document.getElementById(ids[first]);
    if (target){ try { target.focus(); } catch (e) {} }
    return;
  }
  const active = ed.mode === "edit" ? packageActiveMembers(ed.id).length : 0;
  const changedTerms = ed.mode === "edit" && (ed.draft.type !== ed.savedType || (pkgHasSessions(ed.draft) && Number(ed.draft.sessions) !== Number(ed.savedSessions)));
  if (changedTerms && active > 0 && ed.termsApproved !== pkgTermsKey(ed.draft)){
    openPackageConfirm({
      title: "Confirm the new terms",
      body: '<p>This package has <strong>' + active + ' active ' + (active === 1 ? "membership" : "memberships") + '</strong>. Changing the type or session allowance applies to new memberships only. Existing memberships keep their original terms.</p>',
      confirmLabel: "Save new terms",
      onConfirm: function(){ ed.termsApproved = pkgTermsKey(ed.draft); savePackage(); }
    });
    return;
  }
  const normalized = {
    name: String(ed.draft.name).trim(),
    description: String(ed.draft.description || "").trim(),
    type: ed.draft.type,
    validity: pkgHasTime(ed.draft) ? { n: Number(ed.draft.validity.n), unit: ed.draft.validity.unit } : null,
    sessions: pkgHasSessions(ed.draft) ? Number(ed.draft.sessions) : null,
    price: Math.round(Number(ed.draft.price) * 100) / 100,
    active: !!ed.draft.active
  };
  if (ed.mode === "new"){
    normalized.id = "PKG-" + String(state.ids.package++).padStart(2, "0");
    state.packages.push(normalized);
    state.pkgFilters = { q: "", status: "all" };
  } else {
    normalized.id = ed.id;
    const i = state.packages.findIndex(function(p){ return p.id === ed.id; });
    if (i >= 0) state.packages[i] = normalized;
  }
  const savedName = normalized.name;
  const wasNew = ed.mode === "new";
  const focusId = normalized.id;
  closePackagePanel(false);
  paint();
  const focusTarget = wasNew
    ? document.querySelector('[data-action="pkg-new"]')
    : document.querySelector('[data-action="pkg-edit"][data-id="' + focusId + '"]');
  if (focusTarget){ try { focusTarget.focus(); } catch (e) {} }
  toast("Package ‘" + savedName + "’ saved.");
}
function pkgToggle(id){
  const p = packageById(id);
  if (!p) return;
  if (p.active){
    const names = packageActiveNames(id);
    const total = packageMemberships(id).length;
    const list = names.length ? '<p style="margin:0 0 6px">Affected active members, by name:</p><ul style="margin:0 0 10px;padding-left:18px;font-size:12.5px;line-height:1.6">' + names.map(function(n){ return "<li>" + esc(n) + "</li>"; }).join("") + '</ul>' : '<p>No active memberships are affected.</p>';
    openPackageConfirm({
      title: "Deactivate ‘" + p.name + "’?",
      body: list + '<p>' + names.length + ' active ' + (names.length === 1 ? "membership is" : "memberships are") + ' affected. ' + (total > names.length ? 'Historical memberships keep their terms. ' : "") + 'New assignments are blocked until you reactivate the package. Nothing is deleted.</p>',
      confirmLabel: "Deactivate package",
      danger: true,
      onConfirm: function(){ p.active = false; paint(); toast("Package ‘" + p.name + "’ deactivated. Existing memberships are unchanged."); }
    });
  } else {
    p.active = true;
    paint();
    toast("Package ‘" + p.name + "’ activated. It can be assigned to new memberships.");
  }
}

/* ---------- event wiring ---------- */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.getAttribute("data-action");
  if (a === "toast-dismiss"){
    const t = el.closest(".toast");
    if (t) t.remove();
    return;
  }
  if (a === "nav"){
    e.preventDefault();
    const r = el.getAttribute("data-route");
    if (r){ if (r === "customers") state.filters.page = 1; navigate(r); }
    return;
  }
  if (a === "open-nav"){
    const shell = document.getElementById("shell");
    if (shell) shell.classList.add("nav-open");
    el.setAttribute("aria-expanded", "true");
    setTimeout(function(){ const first = document.querySelector(".nav-link"); if (first) first.focus(); }, 60);
    return;
  }
  if (a === "close-nav"){
    const shell = document.getElementById("shell");
    if (shell) shell.classList.remove("nav-open");
    const menu = document.querySelector(".menu-btn");
    if (menu) menu.setAttribute("aria-expanded", "false");
    return;
  }
  if (a === "signout"){
    closeModal();
    state.auth = false;
    document.getElementById("app").innerHTML = authHTML();
    document.title = "Sign in — BGMS";
    try { history.replaceState(null, "", "#signin"); } catch (err) {}
    return;
  }
  if (a === "forgot"){
    e.preventDefault();
    const msg = document.getElementById("auth-msg");
    if (msg){
      msg.textContent = "Password reset isn’t available in this build. Ask the system administrator to reset owner access.";
      msg.classList.remove("is-hidden");
    }
    return;
  }
  if (a === "new-customer"){ openNewCustomer(); return; }
  if (a === "new-membership"){ openMembershipModal(el.getAttribute("data-id") || null, "new"); return; }
  if (a === "open-payment"){ openPaymentModal(el.getAttribute("data-id") || null); return; }
  if (a === "open-correction"){ openCorrectionModal(el.getAttribute("data-id") || state.route.param); return; }
  if (a === "review-reminder"){
    const key = el.getAttribute("data-key");
    const name = el.getAttribute("data-name");
    if (key){
      state.reviewed.add(key);
      paint();
      toast("Reminder marked reviewed for " + name + ". The record is unchanged.");
    }
    return;
  }
  if (a === "set-theme"){ setTheme(el.getAttribute("data-theme-choice")); return; }
  if (a === "pkg-new"){ openPackageEditor(null); return; }
  if (a === "pkg-edit"){ openPackageEditor(el.getAttribute("data-id")); return; }
  if (a === "pkg-toggle"){ pkgToggle(el.getAttribute("data-id")); return; }
  if (a === "pkg-close"){ requestClosePackage(); return; }
  if (a === "pkg-filter"){ state.pkgFilters.status = el.getAttribute("data-status") || "all"; paint(); return; }
  if (a === "pkg-reset"){ state.pkgFilters = { q: "", status: "all" }; paint(); return; }
  if (a === "pkg-confirm"){
    const pending = state.pkgPending;
    state.pkgPending = null;
    closeModal();
    if (pending && pending.onConfirm) pending.onConfirm();
    return;
  }
  if (a === "pkg-confirm-cancel"){
    const pending = state.pkgPending;
    state.pkgPending = null;
    closeModal();
    if (pending && pending.onCancel) pending.onCancel();
    return;
  }
  if (a === "close-modal"){ closeModal(); return; }
  if (a === "payment-back"){ if (pendingPayment) openPaymentModal(pendingPayment.customerId, pendingPayment); return; }
  if (a === "confirm-payment"){ if (pendingPayment) recordPayment(pendingPayment); return; }
  if (a === "correction-back"){ if (pendingCorrection) openCorrectionModal(el.getAttribute("data-id"), pendingCorrection); return; }
  if (a === "confirm-correction"){ if (pendingCorrection) recordCorrection(pendingCorrection); return; }
  if (a === "filter"){
    state.filters.filter = el.getAttribute("data-filter");
    state.filters.page = 1;
    paint();
    return;
  }
  if (a === "sort"){
    const key = el.getAttribute("data-key");
    if (state.filters.sort === key) state.filters.dir = state.filters.dir === "asc" ? "desc" : "asc";
    else { state.filters.sort = key; state.filters.dir = "asc"; }
    state.filters.page = 1;
    paint();
    return;
  }
  if (a === "page"){
    const p = parseInt(el.getAttribute("data-page"), 10);
    if (isFinite(p)){ state.filters.page = Math.max(1, p); paint(); }
    return;
  }
  if (a === "reset-filters"){
    state.filters = { q: "", filter: "all", sort: "name", dir: "asc", page: 1 };
    paint();
    return;
  }
  if (a === "open-customer"){
    const id = el.getAttribute("data-id");
    if (id){ state.tab = "overview"; navigate("customer", id); }
    return;
  }
  if (a === "tab"){
    state.tab = el.getAttribute("data-tab") || "overview";
    paint();
    return;
  }
  if (a === "archive-customer"){ openArchiveConfirm(el.getAttribute("data-id")); return; }
  if (a === "confirm-archive"){
    const c = customerById(el.getAttribute("data-id"));
    if (c){
      c.archived = true;
      closeModal();
      paint();
      toast(c.name + " archived. Records are kept and can be restored.");
    }
    return;
  }
  if (a === "restore-customer"){
    const c = customerById(el.getAttribute("data-id"));
    if (c){
      c.archived = false;
      paint();
      toast(c.name + " restored to the active register.");
    }
    return;
  }
  if (a === "edit-customer"){ openEditCustomer(el.getAttribute("data-id")); return; }
  if (a === "renew"){ openMembershipModal(el.getAttribute("data-id"), "renew"); return; }
  if (a === "save-notes"){
    const ta = document.getElementById("private-notes");
    const c = customerById(el.getAttribute("data-id"));
    if (ta && c){
      c.notes = ta.value.trim();
      toast("Private note saved for " + c.name + ".");
    }
    return;
  }
  if (a === "mark"){
    const sid = state.selectedSession;
    const cid = el.getAttribute("data-cid");
    const mk = el.getAttribute("data-mark");
    if (!state.marks[sid]) state.marks[sid] = {};
    state.marks[sid][cid] = state.marks[sid][cid] === mk ? "" : mk;
    updateAttendanceUI();
    return;
  }
  if (a === "save-attendance"){ openAttendanceConfirm(); return; }
  if (a === "confirm-attendance"){ saveAttendance(); return; }
  if (a === "preset"){ presetRange(el.getAttribute("data-preset")); return; }
  if (a === "export-csv"){ exportCSV(); return; }
  if (a === "print-report"){ try { window.print(); } catch (err) {} return; }
});

document.addEventListener("submit", function(e){
  const id = e.target.id;
  if (!id) return;
  if (id === "signin-form"){ e.preventDefault(); signIn(); return; }
  if (id === "payment-form"){ e.preventDefault(); submitPaymentForm(); return; }
  if (id === "correction-form"){ e.preventDefault(); submitCorrectionForm(); return; }
  if (id === "new-customer-form"){ e.preventDefault(); submitNewCustomer(); return; }
  if (id === "membership-form"){ e.preventDefault(); submitMembershipForm(); return; }
  if (id === "edit-customer-form"){ e.preventDefault(); submitEditCustomer(); return; }
  if (id === "report-form"){ e.preventDefault(); applyReportRange(); return; }
  if (id === "settings-form"){ e.preventDefault(); submitSettings(); return; }
  if (id === "pkg-form"){ e.preventDefault(); savePackage(); return; }
});

document.addEventListener("input", function(e){
  if (e.target.id === "pkg-search"){
    const pos = e.target.selectionStart;
    state.pkgFilters.q = e.target.value;
    paint();
    const next = document.getElementById("pkg-search");
    if (next){ next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
    return;
  }
  if (e.target.getAttribute && e.target.getAttribute("data-pkg-field")){
    const ed = state.pkgEditor;
    if (!ed) return;
    const field = e.target.getAttribute("data-pkg-field");
    if (field === "name"){ ed.draft.name = e.target.value; ed.touched.name = true; }
    else if (field === "description"){ ed.draft.description = e.target.value; ed.touched.description = true; }
    else if (field === "price"){ ed.draft.price = e.target.value; ed.touched.price = true; }
    else if (field === "validityN"){ ed.draft.validity = ed.draft.validity || { n: 1, unit: "months" }; ed.draft.validity.n = e.target.value; ed.touched.validity = true; }
    else if (field === "validityUnit"){ ed.draft.validity = ed.draft.validity || { n: 1, unit: "months" }; ed.draft.validity.unit = e.target.value; ed.touched.validity = true; }
    else if (field === "sessions"){ ed.draft.sessions = e.target.value; ed.touched.sessions = true; }
    refreshPackageForm();
    return;
  }
  if (e.target.id === "customer-search"){
    const pos = e.target.selectionStart;
    state.filters.q = e.target.value;
    state.filters.page = 1;
    paint();
    const next = document.getElementById("customer-search");
    if (next){ next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
    return;
  }
  if (e.target.id === "pay-amount"){ updatePaymentPreview(); return; }
});

document.addEventListener("change", function(e){
  if (e.target.matches("[data-pkg-type]")){ applyPackageType(e.target.value); return; }
  if (e.target.getAttribute && e.target.getAttribute("data-pkg-field") === "active"){
    if (state.pkgEditor){ state.pkgEditor.draft.active = e.target.value === "true"; refreshPackageForm(); }
    return;
  }
  if (e.target.getAttribute && e.target.getAttribute("data-pkg-field") === "validityUnit"){
    const ed = state.pkgEditor;
    if (ed){
      ed.draft.validity = ed.draft.validity || { n: 1, unit: "months" };
      ed.draft.validity.unit = e.target.value;
      ed.touched.validity = true;
      refreshPackageForm();
    }
    return;
  }
  if (e.target.id === "pkg-price"){
    const ed = state.pkgEditor;
    if (!ed) return;
    const raw = String(e.target.value).trim();
    if (raw !== "" && isFinite(Number(raw))){ ed.draft.price = Number(raw).toFixed(2); e.target.value = ed.draft.price; }
    refreshPackageForm();
    return;
  }
  if (e.target.id === "pkg-sessions"){ pkgSessionConfirmIfNeeded(); return; }
  if (e.target.matches('[data-action="period"]')){
    state.period = e.target.value;
    paint();
    return;
  }
  if (e.target.id === "session-select"){
    state.selectedSession = e.target.value;
    paint();
    return;
  }
});

document.addEventListener("keydown", function(e){
  const modalRoot = document.getElementById("modal-root");
  const modalOpen = modalRoot && modalRoot.children.length > 0;
  const panelRoot = document.getElementById("pkg-panel-root");
  const panelOpen = panelRoot && panelRoot.querySelector(".pkg-panel");
  if (e.key === "Escape"){
    if (modalOpen){ e.preventDefault(); closeModal(); return; }
    if (panelOpen){ e.preventDefault(); requestClosePackage(); return; }
    const shell = document.getElementById("shell");
    if (shell && shell.classList.contains("nav-open")){
      shell.classList.remove("nav-open");
      const menu = document.querySelector(".menu-btn");
      if (menu) menu.setAttribute("aria-expanded", "false");
    }
    return;
  }
  if (e.key === "Tab" && (modalOpen || panelOpen)){
    const scope = modalOpen ? modalRoot : panelRoot.querySelector(".pkg-panel");
    const f = Array.prototype.slice.call(scope.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    return;
  }
  if ((e.key === "Enter" || e.key === " ") && e.target && e.target.matches && e.target.matches('tr[data-action="open-customer"]')){
    e.preventDefault();
    const id = e.target.getAttribute("data-id");
    if (id){ state.tab = "overview"; navigate("customer", id); }
  }
});

  });
