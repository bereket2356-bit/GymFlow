<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGMS — Boxing Gym Management System</title>
<meta name="description" content="Owner-only management console for Foundry Boxing Club. Sample data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0B; --surface:#121214; --surface-2:#1A1A1D; --surface-3:#232327; --border:#262629; --border-strong:#3A3A40;
  --text:#F4F4F5; --text-muted:#8E8E98;
  --accent:#C8FF3E; --accent-solid:#C8FF3E; --accent-hover:#D4FF63; --accent-active:#B9EF2C;
  --accent-ink:#0A0A0B; --accent-text:#C8FF3E;
  --success:#3DDC97; --warning:#FFB020; --danger:#FF4D4F; --info:#5AA9FF; --info-ink:#04121F; --on-success:#0A0A0B;
  --tint-success:rgba(61,220,151,.12); --tint-warning:rgba(255,176,32,.12);
  --tint-danger:rgba(255,77,79,.12); --tint-info:rgba(90,169,255,.12);
  --tint-accent:rgba(200,255,62,.10); --tint-neutral:rgba(142,142,152,.12);
  --font-display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --font-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:3px; --sidebar:240px; --topbar:64px;
  --overlay:rgba(5,5,6,.72); --topbar-bg:rgba(10,10,11,.84);
  --glow-accent:rgba(200,255,62,.065); --glow-info:rgba(90,169,255,.05);
  --grain-line:rgba(255,255,255,.016);
  --focus-ring:rgba(200,255,62,.14); --accent-halo:rgba(200,255,62,.05); --accent-halo-soft:rgba(200,255,62,.03);
  --accent-keyline:rgba(200,255,62,.045); --primary-inset:rgba(0,0,0,.18);
  --drawer-shadow:rgba(0,0,0,.6); --scrim-shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F5F5F2; --surface:#FFFFFF; --surface-2:#EDEDE8; --surface-3:#E4E4DC; --border:#DADAD3; --border-strong:#B9B9AE;
  --text:#0F0F10; --text-muted:#5C5C66;
  --accent:#6B8F00; --accent-solid:#C8FF3E; --accent-hover:#B9EF2C; --accent-active:#A8DE1F;
  --accent-ink:#0A0A0B; --accent-text:#4F6B00;
  --success:#137A4F; --warning:#9A5B00; --danger:#C62828; --info:#1F5FBF; --info-ink:#FFFFFF; --on-success:#FFFFFF;
  --tint-success:rgba(19,122,79,.12); --tint-warning:rgba(154,91,0,.12);
  --tint-danger:rgba(198,40,40,.11); --tint-info:rgba(31,95,191,.11);
  --tint-accent:rgba(107,143,0,.12); --tint-neutral:rgba(92,92,102,.10);
  --overlay:rgba(30,30,32,.42); --topbar-bg:rgba(245,245,242,.88);
  --glow-accent:rgba(183,239,46,.16); --glow-info:rgba(31,95,191,.055);
  --grain-line:rgba(20,20,22,.012);
  --focus-ring:rgba(107,143,0,.20); --accent-halo:rgba(107,143,0,.07); --accent-halo-soft:rgba(107,143,0,.04);
  --accent-keyline:rgba(107,143,0,.06); --primary-inset:rgba(0,0,0,.14);
  --drawer-shadow:rgba(15,15,16,.28); --scrim-shadow:rgba(15,15,16,.22);
  color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:var(--font-ui); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1100px 560px at 82% -12%, var(--glow-accent), transparent 62%),
    radial-gradient(900px 520px at -12% 104%, var(--glow-info), transparent 60%),
    repeating-linear-gradient(135deg, var(--grain-line) 0 1px, transparent 1px 5px);
}
[data-theme="light"] body::before{
  background:
    radial-gradient(1000px 520px at 84% -10%, var(--glow-accent), transparent 62%),
    radial-gradient(800px 460px at -10% 104%, var(--glow-info), transparent 60%),
    repeating-linear-gradient(135deg, var(--grain-line) 0 1px, transparent 1px 6px);
}
html.theme-fade, html.theme-fade *, html.theme-fade *::before, html.theme-fade *::after{
  transition:background-color .2s ease, color .2s ease, border-color .2s ease, fill .2s ease, stroke .2s ease !important;
}
@media (prefers-reduced-motion: reduce){
  html.theme-fade, html.theme-fade *, html.theme-fade *::before, html.theme-fade *::after{transition:none !important}
}
h1,h2,h3,h4,p,figure{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img,svg{display:block;max-width:100%}
::selection{background:var(--accent-solid);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.is-hidden{display:none !important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.label{
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-muted);line-height:1.4;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:8px;
  border-right:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,var(--bg) 62%);
  z-index:50;
}
.sidebar-head{padding:20px 18px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-height:44px;border-radius:2px}
.brand-mark{
  width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;
  border:1px solid var(--accent);background:var(--tint-accent);border-radius:2px;
}
.brand-mark svg{width:24px;height:24px}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1}
.brand-sub{display:block;margin-top:4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-label{padding:14px 10px 6px}
.nav-link{
  display:flex;align-items:center;gap:11px;min-height:44px;padding:0 10px;
  border-radius:2px;text-decoration:none;color:var(--text-muted);font-size:13.5px;font-weight:500;
  border:1px solid transparent;transition:background .16s,color .16s,border-color .16s;
}
.nav-link svg{width:17px;height:17px;flex:0 0 17px;opacity:.8}
.nav-link:hover{color:var(--text);background:var(--surface-2)}
.nav-link.is-active{
  color:var(--accent-text);background:var(--tint-accent);border-color:var(--border);
  box-shadow:inset 2px 0 0 var(--accent),inset 0 0 22px var(--accent-halo);
}
.nav-link.is-active svg{opacity:1}
.nav-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.nav-link.is-active .nav-count{color:var(--accent-text)}
.sidebar-foot{margin-top:auto;padding:14px;border-top:1px solid var(--border)}
.owner{display:flex;align-items:center;gap:10px;padding:2px 2px 12px}
.avatar{
  display:grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:2px;
  background:var(--surface-2);border:1px solid var(--border);
  font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--text);
}
.avatar.lg{width:58px;height:58px;font-size:18px;border-color:var(--border)}
.owner-name{font-size:13px;font-weight:500;line-height:1.2}
.owner-role{font-size:11px;color:var(--text-muted);margin-top:2px}
.signout{width:100%;justify-content:flex-start;color:var(--text-muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;height:var(--topbar);
  display:flex;align-items:center;gap:14px;padding:0 clamp(14px,3vw,30px);
  border-bottom:1px solid var(--border);background:var(--topbar-bg);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.menu-btn{display:none}
.topbar-gym{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-meta{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.clock{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);white-space:nowrap}
.tag{
  display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--border);
  border-radius:2px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);
  white-space:nowrap;background:var(--surface);
}
.view{width:100%;max-width:1280px;margin:0 auto;padding:clamp(20px,3vw,32px) clamp(14px,3vw,30px) 72px;flex:1}
.sidebar-scrim{display:none}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.page-head-main{min-width:0;flex:1 1 420px}
.page-title{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3.2vw,32px);letter-spacing:-.035em;line-height:1.06}
.page-meta{margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-muted)}
.page-meta .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--border)}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero-sentence{
  margin-top:16px;font-family:var(--font-display);font-weight:500;font-size:clamp(17px,2vw,21px);
  letter-spacing:-.015em;line-height:1.35;max-width:72ch;color:var(--text);
}
.hero-sentence .num{color:var(--accent-text);font-size:.95em;letter-spacing:-.02em}
.hero-sentence .num.danger{color:var(--danger)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 15px;
  border:1px solid var(--border);border-radius:2px;background:var(--surface);color:var(--text);
  font-size:13px;font-weight:500;line-height:1;text-decoration:none;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent-solid);border-color:var(--accent-solid);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:inset 0 0 0 1px var(--primary-inset)}
.btn-primary:active{background:var(--accent-active)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
.btn-ghost:hover{color:var(--text);background:var(--surface-2);border-color:var(--border)}
.btn-danger{color:var(--danger);border-color:var(--border);background:transparent}
.btn-danger:hover{background:var(--tint-danger);border-color:var(--danger)}
.btn-sm{min-height:38px;padding:0 12px;font-size:12px}
@media (max-width:760px){.btn-sm{min-height:44px}}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn{
  display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);
  background:var(--surface);border-radius:2px;color:var(--text-muted);
}
.icon-btn:hover{color:var(--text);background:var(--surface-2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field + .field{margin-top:0}
.input,.select,.textarea{
  width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:2px;
  background:var(--bg);color:var(--text);font-size:13.5px;
  transition:border-color .15s,box-shadow .15s;
}
@media (prefers-color-scheme: light){.input,.select,.textarea{background:var(--surface)}}
.input:hover,.select:hover,.textarea:hover{border-color:var(--border-strong)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-ring)}
.input::placeholder,.textarea::placeholder{color:var(--text-muted);opacity:.75}
.textarea{min-height:104px;resize:vertical;line-height:1.5}
.select{
  appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.field-hint{font-size:11.5px;color:var(--text-muted);line-height:1.4}
.field-error{font-size:11.5px;color:var(--danger);line-height:1.4;display:flex;gap:5px;align-items:flex-start}
.field-error::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--danger);margin-top:6px;flex:0 0 4px}
.input.has-error,.select.has-error,.textarea.has-error{border-color:var(--danger)}
.input[type="date"]{font-family:var(--font-mono);font-size:12.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .span-2{grid-column:span 2}
@media (max-width:620px){.form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:span 1}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:15px 17px;border-bottom:1px solid var(--border)}
.card-title{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.015em;line-height:1.25}
.card-sub{margin-top:4px;font-size:11.5px;color:var(--text-muted);max-width:56ch;line-height:1.45}
.card-body{padding:17px}
.card-foot{padding:12px 17px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-link{font-size:12px;color:var(--accent-text);text-decoration:none;font-weight:500;display:inline-flex;align-items:center;min-height:32px}
.card-link:hover{text-decoration:underline;text-underline-offset:3px}
.callout{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);
  border-left:2px solid var(--info);background:var(--tint-info);border-radius:2px;font-size:12px;line-height:1.5;
}
.callout strong{font-weight:600}
.callout--warning{border-left-color:var(--warning);background:var(--tint-warning)}
.callout--muted{border-left-color:var(--border);background:var(--surface-2)}

.pill{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;
  font-size:11px;font-weight:500;line-height:1;white-space:nowrap;letter-spacing:.01em;
}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 5px}
.pill--active{color:var(--success);background:var(--tint-success)}
.pill--soon{color:var(--warning);background:var(--tint-warning)}
.pill--expired,.pill--overdue{color:var(--danger);background:var(--tint-danger)}
.pill--exhausted{color:var(--info);background:var(--tint-info)}
.pill--scheduled{color:var(--info);background:var(--tint-info)}
.pill--paid{color:var(--success);background:var(--tint-success)}
.pill--partial{color:var(--info);background:var(--tint-info)}
.pill--unpaid{color:var(--warning);background:var(--tint-warning)}
.pill--reviewed{color:var(--text-muted);background:var(--tint-neutral)}
.pill--neutral{color:var(--text-muted);background:var(--tint-neutral)}
.pill--accent{color:var(--accent-text);background:var(--tint-accent)}
.pill--plain::before{display:none}

.kpi-strip{
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--border);
  background:var(--surface);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;
}
.kpi{padding:15px 16px 13px;min-width:0;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:5px}
.kpi:first-child{border-left:0}
.kpi-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:clamp(21px,2.2vw,26px);font-weight:500;letter-spacing:-.035em;line-height:1.1}
.kpi-value.accent{color:var(--accent-text)}
.kpi-value.danger{color:var(--danger)}
.kpi-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:auto}
.kpi-meta{font-size:10.5px;color:var(--text-muted);line-height:1.3}
.spark{width:58px;height:20px;flex:0 0 58px;opacity:.9}
@media (max-width:1080px){
  .kpi-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi:nth-child(4){border-left:0}
  .kpi:nth-child(n+4){border-top:1px solid var(--border)}
}
@media (max-width:620px){
  .kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--border)}
  .kpi:nth-child(even){border-left:1px solid var(--border)}
  .kpi:nth-child(odd){border-left:0}
}

.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-3{grid-column:span 3}
.col-6{grid-column:span 6}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
@media (max-width:1100px){
  .col-4,.col-5,.col-3{grid-column:span 6}
  .actions-card{grid-column:span 12}
  .col-7,.col-8{grid-column:span 12}
}
@media (max-width:700px){.dash-grid > *{grid-column:span 12 !important}}

/* donut */
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-figure{position:relative;width:168px;height:168px;flex:0 0 168px;margin-inline:auto}
.donut-figure svg{width:100%;height:100%}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut-center .amount{font-family:var(--font-mono);font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.donut-center .cap{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-top:3px}
.donut-legend{display:flex;flex-direction:column;gap:10px;flex:1 1 150px;min-width:130px}
.legend-row{display:flex;align-items:baseline;gap:8px;font-size:12px}
.legend-row .swatch{width:9px;height:9px;flex:0 0 9px;border-radius:1px;margin-top:1px}
.legend-row .swatch--outline{background:transparent;border:1px dashed var(--danger)}
.legend-row .legend-label{color:var(--text-muted)}
.legend-row .legend-val{margin-left:auto;font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.period-select{min-height:34px;padding:4px 26px 4px 8px;font-size:11.5px;background-position:calc(100% - 13px) 15px,calc(100% - 9px) 15px;width:auto;max-width:150px}
@media (max-width:760px){.period-select{min-height:44px;background-position:calc(100% - 13px) 20px,calc(100% - 9px) 20px}}

/* reminders */
.reminder-note{display:flex;gap:8px;align-items:flex-start;padding:9px 17px;background:var(--tint-info);border-bottom:1px solid var(--border);font-size:11.5px;line-height:1.45;color:var(--text)}
.reminder-note .dot{width:6px;height:6px;border-radius:50%;background:var(--info);flex:0 0 6px;margin-top:5px}
.reminder-list{list-style:none;margin:0;padding:0;max-height:322px;overflow:auto}
.reminder{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 17px;border-top:1px solid var(--border);align-items:center}
.reminder:first-child{border-top:0}
.reminder-main{min-width:0}

.tl{position:relative;padding-top:4px}

.tl-block.is-planned{border-color:var(--info);background:var(--tint-info)}
.tl-block.is-completed{border-color:var(--success);background:var(--tint-success)}
.tl-block.is-cancelled{border-color:var(--border);background:var(--surface);color:var(--text-muted);text-decoration:line-through;text-decoration-thickness:1px}
.tl-now{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:3}

.tl-hours{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:12px}
.tl-legend .swatch{width:9px;height:9px;border-radius:1px;border:1px solid;display:inline-block;margin-right:6px;vertical-align:-1px}
.tl-scroll{overflow-x:auto;padding-bottom:2px}
.tl-scroll > .tl-inner{min-width:620px}

.diagram{width:100%;height:auto;display:block}
.diagram-scroll{overflow-x:auto;margin-top:4px}
.diagram-scroll .diagram{min-width:680px}
.diagram text{font-family:var(--font-ui);fill:var(--text)}
.lc-node{stroke:var(--border);fill:var(--surface-2)}
.lc-node.is-on{stroke-width:1.4}
.diagram-caption{font-size:11px;color:var(--text-muted);line-height:1.5}
.diagram-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--text-muted);margin-top:10px}
.diagram-legend span{display:inline-flex;align-items:center;gap:5px}
.diagram-legend i{width:8px;height:8px;border-radius:1px;display:inline-block;border:1px solid var(--border)}

.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--border)}
.pipe-step{padding:14px 16px;position:relative;min-width:0}

.pipe-arrow{position:absolute;left:-5px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-top:1px solid var(--border);border-right:1px solid var(--border);background:var(--surface);rotate:45deg}
@media (max-width:820px){

}
@media (max-width:560px){.pipeline{grid-template-columns:1fr}.pipe-step + .pipe-step{border-left:0;border-top:1px solid var(--border)}.pipe-arrow{display:none}}

.table-wrap{overflow-x:auto;border-top:1px solid var(--border)}
table.table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
.table thead th{
  text-align:left;padding:9px 14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;

}

.table tbody tr{transition:background .12s,box-shadow .12s;cursor:pointer}
.table tbody tr:hover{background:var(--surface-2);box-shadow:inset 0 0 24px var(--accent-halo-soft)}

.table tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.td-id{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);white-space:nowrap}
.td-name{font-weight:500;font-size:13.5px}
.td-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

.progress{width:64px;height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:5px}
.progress > i{display:block;height:100%;background:var(--text-muted);border-radius:99px}
.progress.is-soon > i{background:var(--warning)}
.progress.is-low > i{background:var(--danger)}

.table-empty{padding:34px 18px;text-align:center;color:var(--text-muted);font-size:13px}
.table-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;flex-wrap:wrap}
.pager{display:flex;gap:4px;align-items:center}

  min-width:40px;height:40px;padding:0 8px;border:1px solid var(--border);background:var(--surface);
  border-radius:2px;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);
}
.page-btn:hover{color:var(--text);background:var(--surface-2)}

.page-btn[disabled]{opacity:.4;cursor:not-allowed}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 15px}
.search{position:relative;flex:1 1 240px;max-width:340px;min-width:0}

.chips{display:flex;gap:6px;flex-wrap:wrap}

  transition:color .15s,border-color .15s,background .15s;
}

.detail-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}

.detail-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--text-muted)}

.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;margin-bottom:18px;scrollbar-width:none}

.tab{

}

.detail-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}

.fact-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}

.locked{border-left:2px solid var(--accent)}
.lock-label{display:inline-flex;align-items:center;gap:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.lock-label svg{width:11px;height:11px}
.notes-area{background:var(--bg);border:1px solid var(--border);min-height:96px}
.member-item{padding:14px 16px;border-top:1px solid var(--border)}

.member-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.member-name{font-size:13.5px;font-weight:600}
.member-dates{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:3px}
.ledger{display:flex;flex-direction:column;gap:14px}
.ledger-row .ledger-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.ledger-name{font-size:12.5px;font-weight:500}
.ledger-dates{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted)}
.ledger-track{display:flex;height:12px;border-radius:2px;overflow:hidden;background:transparent;border:1px solid var(--border)}
.ledger-seg{height:100%}
.ledger-seg.paid{background:var(--accent)}
.ledger-seg.partial{background:var(--info)}
.ledger-seg.outline{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--tint-danger) 4px 7px);border-left:1px solid var(--danger);flex:1 1 auto}
.ledger-nums{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px}
.ledger-nums .dead{color:var(--danger)}
.mini-heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:230px}
.mini-cell{aspect-ratio:1;border-radius:1px;background:var(--surface-2);border:1px solid var(--border)}
.mini-cell.on{background:var(--success);border-color:transparent;opacity:.85}
.mini-cell.off{opacity:.45}
.visit-list{list-style:none;margin:0;padding:0;font-size:12.5px}
.visit-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border)}
.visit-list li:first-child{border-top:0}

.bars{display:flex;align-items:flex-end;gap:clamp(4px,1.4vw,14px);height:186px;padding:18px 2px 0;border-bottom:1px solid var(--border);margin-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;position:relative;min-width:0;outline-offset:4px;border-radius:2px}
.bar-col .bar{
  width:100%;max-width:46px;background:var(--surface-2);border:1px solid var(--border);border-bottom:0;
  border-radius:2px 2px 0 0;position:relative;min-height:2px;transition:background .15s,border-color .15s;
  animation:bar-in .6s cubic-bezier(.2,.7,.3,1) both;
}
.bar-col .bar.is-current{background:var(--accent);border-color:var(--accent)}
.bar-col:hover .bar,.bar-col:focus-visible .bar{background:var(--tint-accent);border-color:var(--accent)}
.bar-col .bar.is-current:hover{background:var(--accent)}
@keyframes bar-in{from{transform:scaleY(.12);transform-origin:bottom}}
.bar-tip{
  position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--surface-2);border:1px solid var(--border);border-radius:2px;padding:6px 8px;
  font-family:var(--font-mono);font-size:10.5px;white-space:nowrap;color:var(--text);
  opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;
}
.bar-col:hover .bar-tip,.bar-col:focus-visible .bar-tip{opacity:1}
.bar-x{display:flex;gap:clamp(4px,1.4vw,14px);padding-top:7px;border-top:0}
.bar-x span{flex:1;text-align:center;font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:520px}
.heat-day{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);text-align:center;padding-bottom:2px}
.heat-cell{aspect-ratio:1.5;border-radius:2px;border:1px solid var(--border);position:relative;min-height:22px;display:grid;place-items:center;font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted)}
.heat-cell[data-level="1"]{background:color-mix(in srgb,var(--success) 14%,transparent);border-color:color-mix(in srgb,var(--success) 24%,var(--border));color:var(--text)}
.heat-cell[data-level="2"]{background:color-mix(in srgb,var(--success) 30%,transparent);color:var(--text)}
.heat-cell[data-level="3"]{background:color-mix(in srgb,var(--success) 65%,transparent);color:var(--accent-ink)}
.heat-cell[data-level="4"]{background:var(--success);border-color:var(--success);color:var(--on-success)}
.heat-legend{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-muted);margin-top:10px;flex-wrap:wrap}

.session-summary{display:flex;gap:18px;flex-wrap:wrap;align-items:center}

.roster{list-style:none;margin:0;padding:0}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:2px;overflow:hidden;background:var(--bg)}

  width:44px;height:38px;border:0;border-left:1px solid var(--border);background:transparent;

}

}

.count-bar b{font-family:var(--font-mono);font-size:12px;color:var(--text);font-weight:500;margin-left:4px}
.save-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px;border-top:1px solid var(--border);background:var(--surface)}

.auth-card{width:100%;max-width:408px;position:relative}
.auth-brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.auth-mark{width:58px;height:58px;border:1.5px solid var(--accent);background:var(--tint-accent);display:grid;place-items:center;border-radius:2px;flex:0 0 58px}
.auth-mark svg{width:34px;height:34px}
.auth-word{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.045em;line-height:.95}
.auth-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-top:5px}
.auth-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 24px 22px;position:relative}
.auth-panel::before{content:"";position:absolute;top:-1px;left:-1px;width:28px;height:2px;background:var(--accent)}
.auth-title{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-.02em}
.auth-copy{font-size:12px;color:var(--text-muted);margin-top:5px;line-height:1.5}
.auth-form{display:flex;flex-direction:column;gap:13px;margin-top:20px}
.auth-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.auth-actions a{font-size:12px;color:var(--text-muted);text-decoration:underline;text-underline-offset:3px;min-height:32px;display:inline-flex;align-items:center}
.auth-actions a:hover{color:var(--accent-text)}
.auth-foot{margin-top:18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--text-muted)}

.modal-backdrop{
  position:fixed;inset:0;z-index:100;background:var(--overlay);display:grid;place-items:center;
  padding:18px;overflow:auto;animation:fade .16s ease both;
}
.modal-backdrop.is-closing{animation:fade .12s ease reverse both}
@keyframes fade{from{opacity:0}}
.modal{
  width:100%;max-width:520px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  max-height:calc(100vh - 36px);display:flex;flex-direction:column;position:relative;
  animation:modal-in .18s cubic-bezier(.2,.7,.3,1) both;
}
.modal--wide{max-width:620px}
@keyframes modal-in{from{opacity:0;transform:translateY(8px) scale(.995)}}
.modal::before{content:"";position:absolute;top:-1px;left:-1px;width:34px;height:2px;background:var(--accent)}
.modal-head{padding:17px 20px 13px;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.modal-title{font-family:var(--font-display);font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.modal-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.45}
.modal-close{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border:1px solid transparent;background:none;color:var(--text-muted);border-radius:2px;margin:-6px -8px 0 0}
.modal-close:hover{color:var(--text);background:var(--surface-2)}
.modal-close svg{width:15px;height:15px}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.modal-foot .left{margin-right:auto}
.confirm-block{display:flex;flex-direction:column;gap:14px}
.confirm-list{border:1px solid var(--border);border-radius:2px;background:var(--bg)}
.confirm-row{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--border);font-size:12.5px}
.confirm-row:first-child{border-top:0}
.confirm-row dt{color:var(--text-muted)}
.confirm-row dd{margin:0;text-align:right;font-family:var(--font-mono);font-size:12px}
.confirm-row dd.plain{font-family:var(--font-ui)}
.confirm-total{background:var(--tint-accent)}
.confirm-total dd{color:var(--accent-text);font-weight:500}
@media (max-width:560px){
  .modal-backdrop{padding:0;align-items:flex-end}
  .modal{max-height:94vh;border-radius:4px 4px 0 0;border-bottom:0}
  .modal-head{padding-top:16px}
}

.toast-root{position:fixed;z-index:200;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px));pointer-events:none}
.toast{
  pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:11px 13px;
  background:var(--surface-2);border:1px solid var(--border);border-left:2px solid var(--accent);
  border-radius:2px;font-size:12.5px;line-height:1.45;animation:toast-in .2s ease both;
}
.toast .toast-body{flex:1;min-width:0}
.toast .toast-x{background:none;border:0;padding:0;color:var(--text-muted);width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px}
.toast .toast-x:hover{color:var(--text)}
.toast--danger{border-left-color:var(--danger)}
.toast--info{border-left-color:var(--info)}
@keyframes toast-in{from{opacity:0;transform:translateY(6px)}}
@media (max-width:560px){.toast-root{bottom:12px;right:12px;left:12px;max-width:none}}

.skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:2px}
@keyframes shimmer{to{background-position:-200% 0}}
.skel-line{height:12px;margin-bottom:8px}
.skel-kpi{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);background:var(--surface);margin-bottom:18px}
.skel-kpi > div{padding:16px;border-left:1px solid var(--border);min-height:88px}
.skel-kpi > div:first-child{border-left:0}
@media (max-width:700px){.skel-kpi{grid-template-columns:1fr 1fr}.skel-kpi > div:nth-child(3){border-left:0}.skel-kpi > div:nth-child(n+3){border-top:1px solid var(--border)}}
.skel-card{padding:18px;border:1px solid var(--border);background:var(--surface);margin-bottom:16px}
.skel-row{display:grid;grid-template-columns:120px 1fr 80px 90px;gap:16px;padding:12px 0;border-top:1px solid var(--border);align-items:center}
.skel-row:first-child{border-top:0}

.stack{display:flex;flex-direction:column;gap:16px}
.hstack{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.empty-state{
  padding:34px 20px;border:1px dashed var(--border);border-radius:2px;background:var(--surface);
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:520px;
}
.empty-state p{font-size:13px;color:var(--text-muted);max-width:44ch;line-height:1.5}
.note-line{font-size:11px;color:var(--text-muted);display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.note-line::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--border);margin-top:6px;flex:0 0 3px}
.report-range{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.report-range .field{min-width:132px}
.report-range .input{padding:8px 10px;min-height:40px}
.kpi-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.kpi-4{grid-template-columns:1fr 1fr}.kpi-4 .kpi:nth-child(3){border-left:0}.kpi-4 .kpi:nth-child(n+3){border-top:1px solid var(--border)}}
@media (max-width:560px){.kpi-4{grid-template-columns:1fr}.kpi-4 .kpi{border-left:0!important;border-top:1px solid var(--border)}.kpi-4 .kpi:first-child{border-top:0}}
.chart-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.chart-grid{grid-template-columns:minmax(0,1fr)}}
.fine-print{font-size:10.5px;line-height:1.5;color:var(--text-muted);max-width:70ch}
.kbd{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border);border-bottom-width:2px;border-radius:2px;padding:1px 4px;color:var(--text-muted)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:fixed;top:0;left:0;width:min(86vw,300px);height:100dvh;transform:translateX(-102%);visibility:hidden;
    transition:transform .22s cubic-bezier(.2,.7,.3,1),visibility .22s;box-shadow:0 0 60px var(--drawer-shadow);background:var(--surface);
  }
  .shell.nav-open .sidebar{transform:translateX(0);visibility:visible}
  .sidebar-scrim{display:none;position:fixed;inset:0;z-index:45;background:var(--overlay)}
  .shell.nav-open .sidebar-scrim{display:block}
  .menu-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:2px;color:var(--text)}
  .menu-btn svg{width:18px;height:18px}
  .topbar-gym{font-size:13px}
  .clock{display:none}
}
@media (max-width:900px){.sidebar .brand-sub{display:block}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .flow-dash{animation:none}
}


/* ---------- theme control ---------- */
.theme-slot{display:flex;align-items:center;min-width:0}
.theme-seg{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--border);border-radius:2px;background:var(--surface-2)}
.theme-seg-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.theme-opt{
  display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 7px;border:1px solid transparent;
  border-radius:1px;background:transparent;color:var(--text-muted);font-size:10.5px;font-weight:500;line-height:1;
  transition:background-color .16s,color .16s,border-color .16s;
}
.theme-opt svg{width:13px;height:13px;flex:0 0 13px;opacity:.9}
.theme-opt:hover{color:var(--text);background:var(--surface)}
.theme-opt[aria-pressed="true"]{color:var(--text);background:var(--surface);border-color:var(--border);box-shadow:0 1px 0 var(--primary-inset)}
.theme-opt[aria-pressed="true"] svg{color:var(--accent-text);opacity:1}
.theme-drawer{display:none}
.sidebar .theme-drawer{display:none;width:100%;justify-content:space-between;margin-bottom:12px}
.sidebar .theme-drawer .theme-opt{flex:1 1 0;justify-content:center;min-height:38px;padding:0 4px}
@media (max-width:900px){
  .theme-slot,.theme-top{display:none}
  .sidebar .theme-drawer{display:flex}
}
@media (min-width:901px){.theme-drawer{display:none}}

/* ---------- packages page ---------- */
.pkg-hero{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.pkg-anatomy{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  padding:15px 17px 13px;margin-bottom:16px;
}
.pkg-anatomy-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pkg-anatomy-title{font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:-.01em}
.pkg-anatomy-flow{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1fr) 26px minmax(0,1.15fr);align-items:stretch;gap:0}
.pa-node{border:1px solid var(--border);background:var(--surface-2);border-radius:2px;padding:9px 11px;min-width:0}
.pa-node.is-target{border-color:var(--accent);background:var(--tint-accent)}
.pa-kicker{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.pa-value{font-family:var(--font-display);font-size:13px;font-weight:600;margin-top:3px;line-height:1.2;letter-spacing:-.01em}
.pa-sub{font-size:10.5px;color:var(--text-muted);line-height:1.4;margin-top:3px}
.pa-arrow{position:relative;align-self:center;justify-self:center;width:20px;height:1px;background:var(--border-strong)}
.pa-arrow::after{content:"";position:absolute;right:-1px;top:-3px;width:6px;height:6px;border-top:1px solid var(--border-strong);border-right:1px solid var(--border-strong);transform:rotate(45deg)}
.pkg-table{min-width:980px}
.pkg-table tbody tr{cursor:default}
.pkg-table tbody tr:hover{box-shadow:none}
.pkg-table .pkg-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.pkg-table .btn{min-height:34px;padding:0 10px;font-size:11.5px}
.pkg-table .tag-type{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);padding:3px 6px;border-radius:1px;white-space:nowrap}
.pkg-name-cell{min-width:190px}
.pkg-name-cell .td-name{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pkg-desc{font-size:11px;color:var(--text-muted);line-height:1.4;margin-top:2px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkg-toolbar{padding:13px 15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border)}
.pkg-toolbar .search{max-width:300px}
.pkg-count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);white-space:nowrap}

/* ---------- package editor panel ---------- */
.pkg-panel-backdrop{position:fixed;inset:0;z-index:90;background:var(--overlay);animation:fade .18s ease both}
.pkg-panel{
  position:fixed;top:0;right:0;bottom:0;z-index:95;width:min(540px,100vw);max-width:100%;
  display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);
  box-shadow:-28px 0 70px var(--scrim-shadow);animation:pkg-in .22s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes pkg-in{from{transform:translateX(26px);opacity:0}}
.pkg-panel-head{padding:16px 18px 13px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
.pkg-panel-title{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.pkg-panel-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;line-height:1.4}
.pkg-panel-body{padding:16px 18px 22px;overflow:auto;flex:1;min-height:0}
.pkg-panel-foot{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;justify-content:flex-end;background:var(--surface)}
.pkg-panel-foot .btn-save{min-width:132px}
.pkg-panel-foot .fine-print{margin-right:auto;max-width:24ch;font-size:10px}
.pkg-form{display:flex;flex-direction:column;gap:15px}
.pkg-form .field-error[hidden]{display:none}
.pkg-char{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.pkg-char.is-over{color:var(--danger)}
.pkg-label-row{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.pkg-type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.pkg-type{
  position:relative;display:flex;flex-direction:column;gap:3px;padding:10px 11px;border:1px solid var(--border);
  border-radius:2px;background:var(--bg);cursor:pointer;min-height:64px;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
.pkg-type:hover{border-color:var(--border-strong);background:var(--surface-2)}
.pkg-type input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pkg-type .pt-title{font-size:12.5px;font-weight:600;line-height:1.2;display:flex;align-items:center;gap:6px}
.pkg-type .pt-title::before{content:"";width:9px;height:9px;border:1px solid var(--border-strong);border-radius:50%;flex:0 0 9px;background:var(--surface)}
.pkg-type .pt-sub{font-size:10.5px;color:var(--text-muted);line-height:1.35}
.pkg-type.is-checked{border-color:var(--accent);background:var(--tint-accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pkg-type.is-checked .pt-title::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.pkg-type input:focus-visible + .pt-title{outline:2px solid var(--accent);outline-offset:3px;border-radius:1px}
.pkg-inline{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px}
.pkg-preview-box{border:1px solid var(--border);border-radius:2px;background:var(--bg);padding:12px;margin-top:2px}
.pkg-preview-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.pkg-preview-kicker .label{font-size:9.5px}
.pkg-preview-kicker .mono{font-size:9.5px;color:var(--text-muted)}
.pkg-bar-wrap{padding:4px 2px 0}
.pkg-bar{position:relative;height:16px;border:1px solid var(--border);background:var(--surface-2);border-radius:1px;overflow:hidden}
.pkg-bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-solid),color-mix(in srgb,var(--accent-solid) 55%,var(--surface)))}
.pkg-bar-ticks{display:flex;justify-content:space-between;gap:4px;margin-top:6px;font-family:var(--font-mono);font-size:9px;color:var(--text-muted)}
.pkg-bar-ticks span:nth-child(2){color:var(--text-muted);opacity:.7}
.pkg-sessions{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pkg-session{width:16px;height:16px;border:1px solid var(--accent);background:var(--tint-accent);border-radius:1px}
.pkg-session-more{font-family:var(--font-mono);font-size:9.5px;color:var(--text-muted);align-self:center;margin-left:3px}
.pkg-preview-note{font-size:10.5px;color:var(--text-muted);line-height:1.45;margin-top:8px}
.pkg-notice{
  display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-left:2px solid var(--info);
  background:var(--tint-info);border-radius:2px;font-size:11.5px;line-height:1.45;
}
.pkg-notice strong{font-weight:600}
.pkg-readonly{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-radius:2px;background:var(--surface-2)}
.pkg-readonly .lock-label{flex:0 0 auto;margin-top:2px}
.pkg-readonly p{font-size:11px;color:var(--text-muted);line-height:1.45}
.pkg-readonly strong{color:var(--text);font-weight:500}
.pkg-foot-note{font-size:10px;line-height:1.4;color:var(--text-muted);margin-right:auto;max-width:25ch}
.pkg-inactive-row{color:var(--text-muted)}
.pkg-status-toggle[aria-pressed="true"]{color:var(--danger);border-color:var(--border)}
.pkg-status-toggle[aria-pressed="false"]{color:var(--success);border-color:var(--border)}
.pkg-edit-btn{color:var(--text)}
.pkg-empty-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
@media (max-width:900px){
  .pkg-anatomy-flow{grid-template-columns:1fr;gap:0}
  .pa-arrow{width:1px;height:18px;margin:3px auto}
  .pa-arrow::after{right:-3px;top:auto;bottom:-1px;transform:rotate(135deg)}
  .pkg-type-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .pkg-panel{width:100%;border-left:0;border-top:1px solid var(--border);border-radius:0}
  .pkg-panel-head{padding-top:14px}
  .pkg-panel-body{padding-bottom:28px}
  .pkg-panel-foot{position:sticky;bottom:0;padding-bottom:calc(13px + env(safe-area-inset-bottom))}
  .pkg-inline{grid-template-columns:1fr}
  .pkg-toolbar .search{max-width:none;flex:1 1 100%}
  .pkg-count{margin-left:0}
  .pkg-table .btn{min-height:40px}
}
@media (prefers-reduced-motion: reduce){
  .pkg-panel,.pkg-panel-backdrop{animation:none}
}
[data-theme="light"] .legend-row .swatch,
[data-theme="light"] .heat-legend .sw,
[data-theme="light"] .tl-legend .swatch,
[data-theme="light"] .diagram-legend i{border:1px solid var(--border-strong)}
[data-theme="light"] .card,[data-theme="light"] .kpi-strip,[data-theme="light"] .pkg-anatomy{box-shadow:0 1px 0 var(--grain-line)}


.pkg-money{position:relative}
.pkg-money .cur{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:12.5px;color:var(--text-muted);pointer-events:none}
.pkg-money .input{padding-left:27px}
.field-error[hidden]{display:none}
.pkg-panel-body .textarea{min-height:86px}

[data-theme="light"] .pill{background:color-mix(in srgb,currentColor 8%,var(--surface));border:1px solid color-mix(in srgb,currentColor 22%,var(--border))}
[data-theme="light"] .seg button[aria-pressed="true"][data-mark="A"]{background:color-mix(in srgb,var(--danger) 8%,var(--surface))}
@media print{
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--surface-2:#f4f4f2;--border:#c9c9c4;--text:#111;--text-muted:#555;--accent:#111;--accent-ink:#fff;--accent-text:#111;--danger:#111;--warning:#111;--info:#111;--success:#111}
  body{background:#fff;color:#111}
  body::before{display:none}
  .sidebar,.sidebar-scrim,.topbar,.page-actions,.toast-root,.modal-backdrop,.no-print,.tabs,.btn,.chip,.seg,.pager,.save-bar,.toolbar{display:none !important}
  .shell{display:block}
  .view{padding:0;max-width:none}
  .page-head{margin-bottom:14px}
  .card,.kpi-strip{break-inside:avoid;border-color:#bbb}
  .table-wrap{overflow:visible}
  .dash-grid{display:block}
  .dash-grid > *{margin-bottom:12px}
  .heat-cell,.ledger-seg,.pill,.bar{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  a[href]::after{content:""}
}
</style>
</head>

/* ---------- date + number utils ---------- */
function pad2(n){ return String(n).padStart(2, "0"); }
function todayISO(){
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
const TODAY = todayISO();
function parseISO(iso){
  const p = String(iso).split("-").map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function shiftISO(days, from){ return addDaysISO(from || TODAY, days); }
function addDaysISO(iso, days){
  const d = parseISO(iso);
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function daysFromToday(iso){ return Math.round((parseISO(iso) - parseISO(TODAY)) / 86400000); }
function daysBetween(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
function fmtDate(iso){ const d = parseISO(iso); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
function fmtShort(iso){ const d = parseISO(iso); return d.getDate() + " " + MONTHS[d.getMonth()]; }
function fmtLong(iso){ const d = parseISO(iso); return WEEKDAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS_LONG[d.getMonth()] + " " + d.getFullYear(); }
function monthStartISO(){ return TODAY.slice(0, 8) + "01"; }
function money(n){
  const v = Math.abs(Number(n) || 0);
  const s = Number.isInteger(v) ? v.toLocaleString("en-US") : v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? "−" : "") + "$" + s;
}
function num(n){ return Number(n).toLocaleString("en-US"); }
function plural(n, one, many){ return n === 1 ? one : (many || one + "s"); }
function daysLabel(n){
  if (n === 0) return "today";
  if (n === 1) return "tomorrow";
  if (n === -1) return "yesterday";
  if (n > 0) return "in " + n + " days";
  return Math.abs(n) + " days ago";
}
function esc(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(ch){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch];
  });
}
function initials(name){
  return name.trim().split(/\s+/).slice(0, 2).map(function(w){ return w[0] || ""; }).join("").toUpperCase();
}
function clockLabel(){
  const d = new Date();
  return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}

/* ---------- theme ---------- */
const prefersDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
let themeTimer = 0;
function resolvedTheme(){
  if (state.theme === "system") return prefersDark && prefersDark.matches ? "dark" : "light";
  return state.theme === "light" ? "light" : "dark";
}
function applyTheme(animate){
  const resolved = resolvedTheme();
  const root = document.documentElement;
  root.setAttribute("data-theme", resolved);
  document.querySelectorAll("[data-theme-choice]").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-theme-choice") === state.theme ? "true" : "false");
  });
  if (animate && !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)){
    root.classList.add("theme-fade");
    clearTimeout(themeTimer);
    themeTimer = setTimeout(function(){ root.classList.remove("theme-fade"); }, 230);
  }
}
function setTheme(choice){
  if (["light", "dark", "system"].indexOf(choice) < 0) return;
  state.theme = choice;
  applyTheme(true);
}
if (prefersDark){
  const onScheme = function(){ if (state.theme === "system") applyTheme(true); };
  if (prefersDark.addEventListener) prefersDark.addEventListener("change", onScheme);
  else if (prefersDark.addListener) prefersDark.addListener(onScheme);
}

/* ---------- selectors ---------- */
function customerById(id){ return state.customers.find(function(c){ return c.id === id; }) || null; }
function planOf(key){ return PLANS[key] || PLANS.fightcamp; }
function memType(m){ return m && (m.sessionsTotal != null || planOf(m.plan).type === "session") ? "session" : "time"; }
function paymentsForMembership(mid){ return state.payments.filter(function(p){ return p.membershipId === mid; }); }
function memPaid(m){ return paymentsForMembership(m.id).reduce(function(s, p){ return s + p.amount; }, 0); }
function memBalance(m){ return Math.max(0, m.price - memPaid(m)); }
function memStatus(m){
  if (!m) return "None";
  if (daysFromToday(m.start) > 0) return "Scheduled";
  if (memType(m) === "session" || m.sessionsTotal != null){
    if ((m.sessionsLeft || 0) <= 0) return "Exhausted";
    if (m.end && daysFromToday(m.end) < 0) return "Expired";
    return "Active";
  }
  if (daysFromToday(m.end) < 0) return "Expired";
  if (daysFromToday(m.end) <= 7) return "Expiring soon";
  return "Active";
}
function isOverdue(m){
  const paid = memPaid(m);
  return m.price - paid > 0 && daysFromToday(m.start) < 0;
}
function payStatus(m){
  const paid = memPaid(m);
  const bal = m.price - paid;
  if (bal <= 0) return "Paid";
  if (paid > 0) return "Partial";
  return "Unpaid";
}
function paymentPills(m){
  let html = pill(payStatus(m));
  if (isOverdue(m)) html += " " + pill("Overdue");
  return html;
}
function sortedMemberships(c){
  return c.memberships.slice().sort(function(a, b){ return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
}
function currentMembership(c){
  if (!c || !c.memberships.length) return null;
  const started = sortedMemberships(c).filter(function(m){ return daysFromToday(m.start) <= 0; });
  if (started.length) return started[started.length - 1];
  return sortedMemberships(c)[0];
}
function customerBalance(c){
  return c.memberships.reduce(function(s, m){ return s + memBalance(m); }, 0);
}
function lastVisit(cid){
  const log = (state.attendanceLog[cid] || []).slice().sort();
  return log.length ? log[log.length - 1] : null;
}
function visitsIn30(cid){
  return (state.attendanceLog[cid] || []).filter(function(d){ return daysFromToday(d) >= -30 && daysFromToday(d) <= 0; }).length;
}
function nonArchived(){ return state.customers.filter(function(c){ return !c.archived; }); }
function packageById(id){ return state.packages.find(function(p){ return p.id === id; }) || null; }
function packageTypeLabel(type){ return type === "time" ? "Time-based" : type === "session" ? "Session-based" : type === "both" ? "Both" : "Not set"; }
function validityLabel(n, unit){
  const v = Number(n);
  return (isFinite(v) ? v : 0) + " " + (v === 1 ? unit.replace(/s$/, "") : unit);
}
function packageValidityText(p){
  if (!p || !p.validity || (p.type !== "time" && p.type !== "both")) return "—";
  return validityLabel(p.validity.n, p.validity.unit);
}
function packageSessionsText(p){
  if (!p || p.sessions == null || (p.type !== "session" && p.type !== "both")) return "—";
  return p.sessions + (p.sessions === 1 ? " session" : " sessions");
}
function packageMemberships(id){
  const out = [];
  state.customers.forEach(function(c){
    c.memberships.forEach(function(m){
      if (planOf(m.plan).pkg === id) out.push({ customer: c, membership: m });
    });
  });
  return out;
}
function packageActiveMembers(id){
  return packageMemberships(id).filter(function(row){
    if (row.customer.archived) return false;
    const st = memStatus(row.membership);
    return st === "Active" || st === "Expiring soon";
  });
}
function packageActiveNames(id){
  const seen = {};
  const names = [];
  packageActiveMembers(id).forEach(function(row){
    if (!seen[row.customer.id]){ seen[row.customer.id] = 1; names.push(row.customer.name); }
  });
  return names;
}
function packageRevenue(id){
  const ids = {};
  packageMemberships(id).forEach(function(row){ ids[row.membership.id] = 1; });
  return state.payments.filter(function(p){ return p.kind !== "correction" && ids[p.membershipId]; })
    .reduce(function(sum, p){ return sum + p.amount; }, 0);
}
function packageDays(p){
  if (!p || !p.validity) return 0;
  const mult = p.validity.unit === "weeks" ? 7 : p.validity.unit === "months" ? 30 : p.validity.unit === "years" ? 365 : 1;
  return Math.max(0, Math.round(Number(p.validity.n) * mult));
}

function countByStatus(){
  const counts = { Scheduled: 0, Active: 0, "Expiring soon": 0, Expired: 0, Exhausted: 0 };
  nonArchived().forEach(function(c){
    const s = memStatus(currentMembership(c));
    if (counts[s] != null) counts[s]++;
  });
  return counts;
}
function periodRange(period){
  if (period === "7d") return { from: shiftISO(-6), to: TODAY, label: "Last 7 days" };
  if (period === "30d") return { from: shiftISO(-29), to: TODAY, label: "Last 30 days" };
  if (period === "quarter") return { from: shiftISO(-89), to: TODAY, label: "Last 90 days" };
  return { from: monthStartISO(), to: TODAY, label: "This month" };
}
function inRange(date, from, to){ return date >= from && date <= to; }
function paymentsIn(from, to){
  return state.payments.filter(function(p){ return p.kind !== "correction" && inRange(p.date, from, to); });
}
function collectedIn(from, to){
  return paymentsIn(from, to).reduce(function(s, p){ return s + p.amount; }, 0);
}
function membershipValueIn(from, to){
  return nonArchived().reduce(function(sum, c){
    return sum + c.memberships.reduce(function(s, m){ return s + (inRange(m.start, from, to) ? m.price : 0); }, 0);
  }, 0);
}
function totalOutstanding(){
  return nonArchived().reduce(function(s, c){ return s + customerBalance(c); }, 0);
}
function newCustomersIn(from, to){
  return nonArchived().filter(function(c){ return inRange(c.joined, from, to); }).length;
}
function kpiData(){
  const counts = countByStatus();
  const range = periodRange(state.period);
  const collected = collectedIn(range.from, range.to);
  const outstanding = totalOutstanding();
  return {
    total: state.customers.length,
    live: nonArchived().length,
    archived: state.customers.length - nonArchived().length,
    active: counts.Active + counts["Expiring soon"],
    expiring: counts["Expiring soon"],
    expired: counts.Expired,
    exhausted: counts.Exhausted,
    scheduled: counts.Scheduled,
    collected: collected,
    outstanding: outstanding,
    counts: counts,
    range: range
  };
}
function buildReminders(){
  const out = [];
  nonArchived().forEach(function(c){
    const m = currentMembership(c);
    if (!m) return;
    const status = memStatus(m);
    const push = function(type, rule, text, tone){
      out.push({ key: type + ":" + c.id, type: type, rule: rule, text: text, customer: c, tone: tone || "neutral" });
    };
    if (memType(m) === "time"){
      const d = daysFromToday(m.end);
      if (d < 0){
        push("expired", "Expired", "Membership expired " + Math.abs(d) + " " + plural(Math.abs(d), "day") + " ago", "danger");
      } else if (d <= GYM.warn1){
        push("expiry", "" + GYM.warn1 + "-day window", "Membership expires " + daysLabel(d), "warning");
      } else if (d <= GYM.warn3){
        push("expiry", "" + GYM.warn3 + "-day window", "Membership expires " + daysLabel(d), "warning");
      } else if (d <= GYM.warn7){
        push("expiry", "" + GYM.warn7 + "-day window", "Membership expires " + daysLabel(d), "warning");
      }
    } else {
      if ((m.sessionsLeft || 0) <= 0) push("sessions", "Zero sessions", "Session pack exhausted — 0 of " + m.sessionsTotal + " left", "info");
    }
    const bal = memBalance(m);
    if (bal > 0 && daysFromToday(m.start) < 0 && status !== "Scheduled"){
      push("balance", "Overdue", "Balance of " + money(bal) + " outstanding", "danger");
    }
    const last = lastVisit(c.id);
    if (last && daysFromToday(last) < 0 && Math.abs(daysFromToday(last)) >= GYM.inactive){
      push("inactive", "Inactive " + GYM.inactive + " days", "No visit in " + Math.abs(daysFromToday(last)) + " days", "neutral");
    }
  });
  const order = { expired: 0, balance: 1, sessions: 2, expiry: 3, inactive: 4 };
  return out.sort(function(a, b){
    const oa = order[a.type] == null ? 9 : order[a.type];
    const ob = order[b.type] == null ? 9 : order[b.type];
    if (oa !== ob) return oa - ob;
    return a.customer.name.localeCompare(b.customer.name);
  });
}

  return { display: "PAY-" + state.ids.payment, value: state.ids.payment };

/* ---------- sparkline / donut / timeline / lifecycle / pipeline ---------- */
function sparkHTML(values, tone){
  const vals = values && values.length ? values : [1, 1, 1, 1];
  const max = Math.max.apply(null, vals);
  const min = Math.min.apply(null, vals);
  const span = Math.max(1, max - min);
  const pts = vals.map(function(v, i){
    const x = 2 + i * (54 / Math.max(1, vals.length - 1));
    const y = 18 - ((v - min) / span) * 14;
    return x + "," + y;
  }).join(" ");
  const col = tone === "accent" ? "var(--accent)" : tone === "danger" ? "var(--danger)" : tone === "warning" ? "var(--warning)" : "var(--text-muted)";
  return '<svg class="spark" viewBox="0 0 58 20" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function donutHTML(collected, outstanding){
  const total = collected + outstanding;
  const C = 2 * Math.PI * 68;
  const cShare = total > 0 ? collected / total : 0;
  const oShare = total > 0 ? outstanding / total : 0;
  let arcs = '<circle cx="84" cy="84" r="68" fill="none" stroke="var(--border)" stroke-width="14" opacity=".55"/>';
  if (oShare > 0){
    arcs += '<circle cx="84" cy="84" r="68" fill="none" stroke="var(--danger)" stroke-width="14" opacity=".62" stroke-dasharray="' + Math.max(1, oShare * C - 3) + ' ' + C + '" stroke-dashoffset="' + (-cShare * C) + '" transform="rotate(-90 84 84)"/>';
  }
  if (cShare > 0){
    arcs += '<circle class="donut-arc" cx="84" cy="84" r="68" fill="none" stroke="var(--accent)" stroke-width="14" stroke-dasharray="' + Math.max(1, cShare * C - 3) + ' ' + C + '" transform="rotate(-90 84 84)"/>';
  }
  return '<svg viewBox="0 0 168 168" aria-hidden="true">' + arcs + '</svg>';
}

function timeToMin(t){ const p = t.split(":").map(Number); return p[0] * 60 + p[1]; }
function timelineHTML(){
  const startMin = 5 * 60, endMin = 21 * 60, span = endMin - startMin;
  const blocks = state.sessions.map(function(s){
    const a = timeToMin(s.time), b = timeToMin(s.end);
    const left = ((a - startMin) / span) * 100;
    const width = Math.max(1.2, ((b - a) / span) * 100);
    const cls = s.status === "Completed" ? "is-completed" : s.status === "Cancelled" ? "is-cancelled" : "is-planned";
    return '<div class="tl-block ' + cls + '" style="left:' + left.toFixed(3) + '%;width:' + width.toFixed(3) + '%" title="' + esc(s.title + " · " + s.time + "–" + s.end + " · " + s.status) + '">' +
      '<span class="tb-time">' + s.time + '</span><span class="tb-title">' + esc(s.title) + '</span></div>';
  }).join("");
  let lines = "";
  for (let h = 5; h <= 21; h += 2){
    lines += '<span class="tl-gridline" style="left:' + (((h * 60 - startMin) / span) * 100).toFixed(3) + '%"></span>';
  }
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nowMark = (nowMin >= startMin && nowMin <= endMin)
    ? '<span class="tl-now" style="left:' + (((nowMin - startMin) / span) * 100).toFixed(3) + '%" title="Current time"></span>' : "";
  let hours = "";
  for (let h = 5; h <= 21; h += 2) hours += "<span>" + pad2(h) + ":00</span>";
  return '<div class="tl-scroll"><div class="tl-inner"><div class="tl-track" role="img" aria-label="Today’s session track from 05:00 to 21:00. Fight camp at 17:30 is planned, open ring at 19:00 is planned, sparring at 20:00 is cancelled.">' +
    lines + nowMark + blocks + '</div>' +
    '<div class="tl-hours" aria-hidden="true">' + hours + '</div></div></div>' +
    '<div class="tl-legend" aria-hidden="true"><span><i class="swatch" style="border-color:var(--success);background:var(--tint-success)"></i>Completed</span><span><i class="swatch" style="border-color:var(--info);background:var(--tint-info)"></i>Planned</span><span><i class="swatch" style="border-color:var(--border);background:var(--surface)"></i>Cancelled</span></div>';

/* ---------- router ---------- */
const TITLES = { dashboard: "Dashboard", customers: "Customers", customer: "Customer", packages: "Packages", attendance: "Attendance", reports: "Reports", settings: "Settings" };
let navToken = 0;

function navigate(name, param){
  state.route = { name: name, param: param || null };
  state.navOpen = false;
  const shell = document.getElementById("shell");
  if (shell) shell.classList.remove("nav-open");
  const menu = document.querySelector(".menu-btn");
  if (menu) menu.setAttribute("aria-expanded", "false");
  closeModal();
  const view = document.getElementById("view");
  if (!view) return;
  setActiveNav(name);
  const key = name + (param ? ":" + param : "");
  const token = ++navToken;
  if (!state.seen.has(key)){
    state.seen.add(key);
    view.innerHTML = skeletonFor(name);
    setTimeout(function(){ if (token === navToken) paint(); else return; }, 430);
  } else {
    paint();
  }
  try { window.scrollTo(0, 0); } catch (e) {}
  if (location.hash !== "#" + name) { try { history.replaceState(null, "", "#" + name); } catch (e) {} }
}

function setActiveNav(name){
  const target = name === "customer" ? "customers" : name;
  document.querySelectorAll(".nav-link[data-route]").forEach(function(a){
    const on = a.getAttribute("data-route") === target;
    a.classList.toggle("is-active", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

function paint(){
  const view = document.getElementById("view");
  if (!view) return;
  const name = state.route.name;
  let html = "";
  if (name === "dashboard") html = dashboardHTML();
  else if (name === "customers") html = customersHTML();
  else if (name === "customer") html = customerHTML(state.route.param);
  else if (name === "packages") html = packagesHTML();
  else if (name === "attendance") html = attendanceHTML();
  else if (name === "reports") html = reportsHTML();
  else if (name === "settings") html = settingsHTML();
  view.innerHTML = html;
  setActiveNav(name);
  const navCount = document.querySelector(".nav-count");
  if (navCount) navCount.textContent = state.customers.length;
  const gymEl = document.querySelector(".topbar-gym");
  if (gymEl) gymEl.textContent = GYM.name;
  document.title = (TITLES[name] || "Console") + " — BGMS";
}

function signIn(){
  const email = document.getElementById("email");
  const pass = document.getElementById("password");
  const emailErr = document.getElementById("email-error");
  const passErr = document.getElementById("password-error");
  if (!email || !pass) return;
  let ok = true;
  emailErr.classList.add("is-hidden");
  passErr.classList.add("is-hidden");
  email.classList.remove("has-error");
  pass.classList.remove("has-error");
  if (!email.value.trim() || !/^\S+@\S+\.\S+$/.test(email.value.trim())){
    emailErr.textContent = "Enter a valid email address, like owner@foundry.boxing.";
    emailErr.classList.remove("is-hidden");
    email.classList.add("has-error");
    ok = false;
  }
  if (pass.value.length < 6){
    passErr.textContent = "Passwords are at least 6 characters.";
    passErr.classList.remove("is-hidden");
    pass.classList.add("has-error");
    ok = false;
  }
  if (!ok){ return; }
  state.auth = true;
  state.seen = new Set();
  const app = document.getElementById("app");
  app.innerHTML = shellHTML("");
  navigate("dashboard");
  toast("Signed in as " + OWNER.name + " — owner console.");
}

/* ---------- customers list ---------- */
function sortValue(c, key){
  const m = currentMembership(c);
  if (key === "name") return c.name.toLowerCase();
  if (key === "id") return c.id;
  if (key === "plan") return m ? planOf(m.plan).name.toLowerCase() : "";
  if (key === "status") return memStatus(m);
  if (key === "balance") return customerBalance(c);
  return m ? m.end || m.start : "";
}
function filteredCustomers(){
  const f = state.filters;
  const q = f.q.trim().toLowerCase();
  let list = state.customers.filter(function(c){
    if (f.filter === "archived") { if (!c.archived) return false; }
    else if (c.archived) return false;
    const m = currentMembership(c);
    const status = memStatus(m);
    if (f.filter === "active" && status !== "Active") return false;
    if (f.filter === "expiring" && status !== "Expiring soon") return false;
    if (f.filter === "expired" && status !== "Expired") return false;
    if (f.filter === "balance" && customerBalance(c) <= 0) return false;
    if (q){
      const plan = m ? planOf(m.plan).name : "";
      const hay = (c.name + " " + c.id + " " + c.phone + " " + plan).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  const dir = f.dir === "desc" ? -1 : 1;
  list.sort(function(a, b){
    const va = sortValue(a, f.sort), vb = sortValue(b, f.sort);
    if (va < vb) return -1 * dir;
    if (va > vb) return 1 * dir;
    return a.name.localeCompare(b.name);
  });
  return list;
}
function chipCount(key){
  if (key === "all") return nonArchived().length;
  if (key === "archived") return state.customers.length - nonArchived().length;
  if (key === "balance") return nonArchived().filter(function(c){ return customerBalance(c) > 0; }).length;
  const map = { active: "Active", expiring: "Expiring soon", expired: "Expired" };
  return nonArchived().filter(function(c){ return memStatus(currentMembership(c)) === map[key]; }).length;
}
function progressFor(c){
  const m = currentMembership(c);
  if (!m) return "";
  if (memType(m) === "session"){
    const total = m.sessionsTotal || 1;
    const left = m.sessionsLeft == null ? total : m.sessionsLeft;
    const pct = Math.round((left / total) * 100);
    return '<div class="progress ' + (left === 0 ? "is-low" : left <= 2 ? "is-soon" : "is-ok") + '" aria-hidden="true"><i style="width:' + pct + '%"></i></div>';
  }
  const span = Math.max(1, daysBetween(m.start, m.end));
  const left = Math.max(0, daysFromToday(m.end));
  const pct = Math.max(0, Math.min(100, Math.round((left / span) * 100)));
  const cls = left <= 7 ? "is-soon" : "is-ok";
  return '<div class="progress ' + cls + '" aria-hidden="true"><i style="width:' + pct + '%"></i></div>';
}
function expiryCell(c){
  const m = currentMembership(c);
  if (!m) return '<span class="muted">No membership</span>';
  if (memType(m) === "session"){
    const left = m.sessionsLeft == null ? 0 : m.sessionsLeft;
    return '<div class="td-money">' + left + ' of ' + m.sessionsTotal + ' left</div><div class="td-sub">Valid to ' + fmtShort(m.end) + ' · ' + daysLabel(daysFromToday(m.end)) + '</div>' + progressFor(c);
  }
  const d = daysFromToday(m.end);
  return '<div class="td-money">' + fmtDate(m.end) + '</div><div class="td-sub">' + (d < 0 ? Math.abs(d) + ' days ago' : daysLabel(d)) + '</div>' + progressFor(c);
}

function ledgerBarHTML(m){
  const paid = Math.max(0, memPaid(m));
  const bal = memBalance(m);
  const pct = Math.min(100, Math.round((paid / m.price) * 100));
  const seg = bal <= 0 ? "paid" : "partial";
  const segLabel = bal <= 0 ? "Paid in full" : "Part-payment";
  return '<div class="ledger-track" role="img" aria-label="' + esc(segLabel + ": " + money(paid) + " of " + money(m.price) + (bal > 0 ? ", " + money(bal) + " still owed" : "")) + '">' +
    (paid > 0 ? '<span class="ledger-seg ' + seg + '" style="width:' + Math.max(1, pct) + '%" title="' + esc(segLabel) + ' ' + money(paid) + '"></span>' : '') +
    (bal > 0 ? '<span class="ledger-seg outline" title="Still owed ' + money(bal) + '"></span>' : '') + '</div>';
}
function membershipCardHTML(m, isCurrent){
  const plan = planOf(m.plan);

    '<div class="ledger" style="margin-top:10px"><div class="ledger-row">' + ledgerBarHTML(m) +

function miniHeatHTML(cid){
  const log = state.attendanceLog[cid] || [];
  const visitSet = {};
  log.forEach(function(d){ visitSet[d] = true; });
  let cells = "";
  for (let i = 29; i >= 0; i--){
    const d = shiftISO(-i);
    const on = !!visitSet[d];
    cells += '<span class="mini-cell ' + (on ? "on" : "off") + '" title="' + esc(fmtDate(d) + (on ? " · visited" : " · no visit")) + '"></span>';
  }
  return '<div class="mini-heat" style="grid-template-columns:repeat(10,1fr);max-width:280px" role="img" aria-label="Attendance for the last 30 days: ' + visitsIn30(cid) + ' visits.">' + cells + '</div>';
}
function sessionNameFor(dateISO){
  const day = parseISO(dateISO).getDay();
  if (day === 1 || day === 3 || day === 5) return "Fight camp · 17:30";
  if (day === 2 || day === 4) return "Boxing fundamentals · 07:00";
  if (day === 6) return "Open ring · 19:00";
  return "Sparring · 20:00";
}

}

let pendingPayment = null;
let pendingCorrection = null;
function openMembershipFor(c){
  if (!c) return null;
  const open = sortedMemberships(c).filter(function(m){ return memBalance(m) > 0; });
  return open.length ? open[0] : null;
}
function methodOptions(selected){
  return ["Cash", "Bank transfer", "Card", "Mobile money"].map(function(m){
    return '<option value="' + m + '"' + (selected === m ? " selected" : "") + '>' + m + '</option>';
  }).join("");
}
function updatePaymentPreview(){
  const sel = document.getElementById("pay-customer");
  if (!sel) return;
  const c = customerById(sel.value);
  const m = openMembershipFor(c);
  const bal = m ? memBalance(m) : 0;
  const target = document.getElementById("pay-target");
  const hint = document.getElementById("pay-balance-hint");
  if (target) target.textContent = m ? planOf(m.plan).name + " · " + fmtDate(m.start) + " – " + fmtDate(m.end) : "No open balance on this account.";
  if (hint) hint.textContent = "Outstanding on this membership: " + money(bal);
  const amountEl = document.getElementById("pay-amount");
  const preview = document.getElementById("pay-preview");
  if (!preview) return;
  const amount = parseFloat(amountEl.value);
  if (!isFinite(amount) || amount <= 0 || !m){
    preview.innerHTML = '<span class="muted">Enter an amount to preview the balance.</span>';
    return;
  }
  const after = bal - amount;
  preview.innerHTML = after < 0
    ? '<span style="color:var(--danger)">' + money(after) + ' — more than the balance</span>'
    : '<span class="num" style="font-size:15px;' + (after === 0 ? "color:var(--success)" : "") + '">' + money(after) + '</span>' + (after === 0 ? ' <span class="muted">· settles the membership</span>' : '');
}
function openPaymentModal(customerId, draft){
  const list = nonArchived().slice().sort(function(a, b){ return a.name.localeCompare(b.name); });
  if (!list.length){ toast("Add a customer before recording a payment.", "danger"); return; }
  let cid = customerId || (draft && draft.customerId) || "";
  if (!cid || !customerById(cid) || customerById(cid).archived){
    const withBalance = list.filter(function(c){ return customerBalance(c) > 0; })[0];
    cid = (withBalance || list[0]).id;
  }
  const c = customerById(cid);
  const m = openMembershipFor(c);

function clearErr(id){
  const el = document.getElementById(id);
  if (el){ el.textContent = ""; el.classList.add("is-hidden"); }
}
function showErr(id, msg){
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.classList.remove("is-hidden");
}
function submitPaymentForm(){
  const cid = (document.getElementById("pay-customer") || {}).value;
  const c = customerById(cid);
  const m = openMembershipFor(c);
  const bal = m ? memBalance(m) : 0;
  const amountRaw = (document.getElementById("pay-amount") || {}).value;
  const amount = parseFloat(amountRaw);
  const date = (document.getElementById("pay-date") || {}).value;
  const method = (document.getElementById("pay-method") || {}).value;
  const ref = ((document.getElementById("pay-ref") || {}).value || "").trim();
  ["pay-customer-err", "pay-amount-err", "pay-date-err"].forEach(clearErr);
  let firstBad = null;
  if (!c || c.archived){ showErr("pay-customer-err", "Choose a customer from the register."); firstBad = firstBad || "pay-customer"; }
  else if (!m || bal <= 0){ showErr("pay-customer-err", "This customer has no outstanding balance."); firstBad = firstBad || "pay-customer"; }
  if (!isFinite(amount) || amount <= 0){ showErr("pay-amount-err", "Enter an amount greater than $0."); firstBad = firstBad || "pay-amount"; }
  else if (m && amount > bal){ showErr("pay-amount-err", "The outstanding balance is " + money(bal) + ". An amount can’t be more than that."); firstBad = firstBad || "pay-amount"; }
  if (!date){ showErr("pay-date-err", "Choose the date the money was received."); firstBad = firstBad || "pay-date"; }
  else if (date > TODAY){ showErr("pay-date-err", "A payment date can’t be in the future."); firstBad = firstBad || "pay-date"; }
  if (!method){ firstBad = firstBad || "pay-method"; }
  if (firstBad){
    const el = document.getElementById(firstBad);
    if (el) el.focus();
    return;
  }
  pendingPayment = { customerId: cid, membershipId: m.id, amount: Math.round(amount * 100) / 100, date: date, method: method, ref: ref };
  showPaymentConfirm(pendingPayment);
}
function showPaymentConfirm(p){

function recordPayment(p){

function currentSession(){ return state.sessions.find(function(s){ return s.id === state.selectedSession; }) || state.sessions[0]; }
function attendanceCounts(sid){
  const marks = state.marks[sid] || {};
  const counts = { P: 0, L: 0, A: 0, E: 0, U: 0 };
  (ROSTERS[sid] || []).forEach(function(cid){
    const v = marks[cid] || "";
    if (counts[v] != null && v !== "U") counts[v]++; else counts.U++;
  });
  return counts;
}
function attendanceDirty(sid){
  const a = state.marks[sid] || {}, b = state.savedMarks[sid] || {};
  const keys = {};
  (ROSTERS[sid] || []).forEach(function(k){ keys[k] = true; });
  Object.keys(a).forEach(function(k){ keys[k] = true; });
  Object.keys(b).forEach(function(k){ keys[k] = true; });
  return Object.keys(keys).some(function(k){ return (a[k] || "") !== (b[k] || ""); });
}
function attendanceDeductions(sid){
  const marks = state.marks[sid] || {}, saved = state.savedMarks[sid] || {};
  const out = [];
  (ROSTERS[sid] || []).forEach(function(cid){
    const c = customerById(cid);
    if (!c) return;
    const m = currentMembership(c);
    if (!m || memType(m) !== "session") return;
    const now = marks[cid] === "P" || marks[cid] === "L";
    const was = saved[cid] === "P" || saved[cid] === "L";
    if (now && !was && (m.sessionsLeft || 0) > 0) out.push({ c: c, m: m });
  });
  return out;
}
